[package]
name = "tree-sitter-rsl"
description = "rsl grammar for the tree-sitter parsing library"
version = "0.0.1"
keywords = ["incremental", "parsing", "rsl"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/M4ddCat/tree-sitter-rsl"
edition = "2021"
license = "MIT"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = "~0.26.6"

[build-dependencies]
cc = "1.0"
